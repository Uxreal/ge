syntax = "proto3";

option java_package = "dev.lumen.launcher.core.data.proto";
option java_multiple_files = true;

// User preferences (§2: DataStore(Proto) for preferences). Scalar zero-values mean "unset";
// PrefsRepository maps them to the real defaults so adding a field never migrates anything.
message LumenPrefs {
  int32 schema_version = 1;
  string home_model = 2;        // "PACKED" | "FREEFORM"; "" until onboarding chooses one
  int32 columns = 3;            // 4|5|6; 0 -> 4
  string theme_mode = 4;        // LIGHT|DARK|AUTO|TRUE_BLACK; "" -> AUTO
  float motion_speed = 5;       // 0.5..1.5; 0 -> 1.0
  bool reduce_motion = 6;
  string haptic_intensity = 7;  // OFF|LIGHT|STANDARD|STRONG; "" -> STANDARD
  int32 label_lines = 8;        // 1|2; 0 -> 1
  bool hide_labels = 9;
  float parallax = 10;          // wallpaper offset multiplier 0..1.5; negative sentinel unused, 0 valid -> has_parallax
  bool parallax_set = 11;       // distinguishes "user chose 0" from "unset -> default 1.0"
  bool onboarding_done = 12;
  float smoothness = 13;        // superellipse n, 2.0..6.0; 0 -> 3.0 (D39)
  bool workspace_seeded = 14;

  // §4.1: every package that has pushed a Capsule card, and the ones the user has switched off.
  // A block list you can only populate by guessing package names is not a block list.
  repeated string capsule_seen_packages = 15;
  repeated string capsule_blocked_packages = 16;
  bool capsule_off = 17;        // inverted so the zero-value means "Capsule on"
  bool show_status_bar = 18;    // zero-value = hidden: Lumen owns the top band by default (D30)
  repeated string dock_keys = 19;  // AppKey.flat, in dock order, max 5 (D38)
  repeated string hidden_keys = 20;  // AppKey.flat: drawer-hidden apps behind biometrics (D41)
  bool dock_seeded = 21;             // factory basics were auto-pinned once (D41)
}

// Launch statistics for the drawer's suggested-apps row (§6).
message UsageStats {
  map<string, int64> launch_counts = 1;   // AppKey.flat -> total launches
  map<string, int64> last_launch = 2;     // AppKey.flat -> epoch millis
}
